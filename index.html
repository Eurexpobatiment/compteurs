<!DOCTYPE html>
<html lang="fr">
<head>
<title>Relevés compteurs – Eurexpo</title>
<meta name="theme-color" content="#f3f3f1">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Compteurs">
<style>
:root{
  --bg:#f3f3f1; --card:#fbfbfa; --line:#e4e4e0; --ink:#1d1d1f; --muted:#6b6b70;
  --blue:#2f74d0; --blue-soft:#e8f0fb; --green:#2e7d32; --green-soft:#e7f3e8;
  --amber:#8a5a00; --amber-soft:#fbf0d9; --red:#c62828; --red-soft:#fdecea; --grey-bar:#cfcfcf;
  --eau:#dcebfb; --elc:#fff4c7; --gaz:#e7e7e7; --fuel:#fde2cc;
  --radius:10px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:8px 16px;height:52px}
.top img{height:28px;display:block}
.logo-txt{display:flex;align-items:center;gap:8px;line-height:1}
.logo-txt .lyon{display:flex;align-items:flex-end;gap:2px;font-weight:300;font-size:19px;letter-spacing:-.5px}
.logo-txt .lyon i{display:inline-block;width:11px;height:11px;background:#e30613;margin-right:2px;margin-bottom:3px}
.logo-txt .sep{width:1px;height:24px;background:#9a9a9a}
.logo-txt .eur{font-size:10px;line-height:1.1;font-weight:500}
.top h1{font-size:15px;margin:0;font-weight:700;white-space:nowrap}
.top h1 small{font-weight:400;color:var(--muted);font-size:11px}
.top .sp{flex:1}
.icon-btn{border:1px solid var(--line);background:#fff;border-radius:8px;width:32px;height:30px;display:grid;place-items:center;cursor:pointer}
main{max-width:880px;margin:0 auto;padding:12px 16px 90px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 12px}
.mb{margin-bottom:10px}
label.f{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.field{display:flex;flex-direction:column}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.row > .field{flex:1 1 150px}
input[type=text],input[type=date],input[type=search],select,.inp{height:38px;border:1px solid #cfcfcb;border-radius:8px;background:#fff;padding:0 10px;width:100%}
input:focus,select:focus{outline:2px solid var(--blue);outline-offset:-1px;border-color:var(--blue)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:8px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.kpi span{display:block;font-size:11px;color:var(--muted)}
.kpi b{font-size:14px}
.kpis.big .kpi{padding:10px 12px}
.kpis.big .kpi b{font-size:22px;display:block}
.sect{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:8px;overflow:hidden}
.sect > summary{list-style:none;display:flex;align-items:center;gap:10px;padding:11px 12px;cursor:pointer;font-weight:600}
.sect > summary::-webkit-details-marker{display:none}
.sect > summary .chev{color:var(--muted);font-size:11px;transition:transform .15s;width:10px}
.sect[open] > summary .chev{transform:rotate(90deg)}
.sect > summary .cnt{margin-left:auto;font-size:12px;color:var(--muted);font-weight:500}
.bar{width:58px;height:5px;border-radius:3px;background:#e2e2de;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);border-radius:3px}
.cpt{border-top:1px solid var(--line);padding:10px 12px 12px;border-left:3px solid transparent}
.cpt.done{border-left-color:var(--green)}
.cpt.warn{border-left-color:#e0a100}
.cpt.err{border-left-color:var(--red)}
.cpt h3{font-size:14px;margin:0 0 1px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.chip{font-size:10px;font-weight:600;padding:1px 6px;border-radius:4px;letter-spacing:.3px}
.chip.EAU{background:var(--eau)}.chip.ELC{background:var(--elc)}.chip.GAZ{background:var(--gaz)}.chip.FUEL{background:var(--fuel)}
.num{font-size:11px;color:var(--muted);font-weight:500}
.loc{font-size:12px;color:var(--muted);margin-bottom:6px}
.prev{font-size:12px;color:var(--muted);margin-bottom:6px}
.prev b{color:var(--ink);font-weight:600}
.saisie{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.saisie .idx{width:160px;text-align:right;font-size:17px;font-variant-numeric:tabular-nums;height:42px}
.saisie select{width:auto;min-width:120px;height:42px}
.saisie .com{flex:1 1 200px;height:42px}
.btn{height:42px;border:0;border-radius:8px;background:var(--blue);color:#fff;padding:0 16px;font-weight:600;cursor:pointer}
.btn.sec{background:#fff;color:var(--ink);border:1px solid #cfcfcb}
.btn.warn{background:#e0a100}
.btn:disabled{opacity:.5;cursor:default}
.fb{font-size:12px;margin-top:6px;padding-left:2px}
.fb.ok{color:var(--green)} .fb.warn{color:var(--amber)} .fb.err{color:var(--red)}
.msg{font-size:12.5px;margin-top:8px;padding:8px 10px;border-radius:8px}
.msg.warn{background:var(--amber-soft);color:var(--amber)} .msg.err{background:var(--red-soft);color:var(--red)}
.msg .btn{height:32px;margin-top:6px;padding:0 12px;font-size:12.5px}
.saved{font-size:12px;color:var(--green);margin-left:4px}
.anc{width:160px}
.banner{background:var(--amber-soft);border-radius:8px;padding:9px 12px;margin-bottom:10px;color:var(--amber)}
.banner summary{cursor:pointer;font-weight:600;list-style:none}
.banner summary::-webkit-details-marker{display:none}
.banner summary span{font-weight:400}
.alert{padding:8px 0;border-top:1px solid #efdcb4;font-size:13px;color:var(--ink)}
.alert:first-of-type{border-top:0}
.alert b{display:block}
.lvl{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.lvl.haute{background:var(--red)}.lvl.moyenne{background:#e0a100}.lvl.info{background:#9aa0a6}
.chart h2,.card h2{font-size:14px;margin:0 0 6px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-bottom:8px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.hb{display:grid;grid-template-columns:78px 1fr 62px;align-items:center;gap:8px;font-size:12px;padding:2px 0}
.hb .lbl{text-align:right;color:#444}
.hb .val{color:var(--muted);font-variant-numeric:tabular-nums}
.hb .bars{display:flex;flex-direction:column;gap:2px}
.hb .b1{height:9px;background:var(--blue);border-radius:2px}
.hb .b2{height:5px;background:var(--grey-bar);border-radius:2px}
table.t{width:100%;border-collapse:collapse;font-size:12.5px}
table.t th{text-align:left;font-weight:600;color:var(--muted);font-size:11.5px;padding:6px 6px;border-bottom:1px solid var(--line)}
table.t td{padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.t tr.hl td{background:var(--amber-soft)}
.spark{display:inline-flex;align-items:flex-end;gap:1px;height:18px}
.spark i{width:4px;background:var(--blue);border-radius:1px;min-height:1px;opacity:.75}
.tag{font-size:10.5px;padding:1px 6px;border-radius:10px;background:var(--red-soft);color:var(--red);font-weight:600;white-space:nowrap}
.tag.m{background:var(--amber-soft);color:var(--amber)}
.muted{color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:30px 0}
.scroll{overflow-x:auto}
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;z-index:30;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;border:0;background:none;padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);cursor:pointer}
nav.tabs button svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6}
nav.tabs button.on{color:var(--blue)}
.view{display:none}.view.on{display:block}
.loading{display:grid;place-items:center;height:60vh;color:var(--muted)}
.spin{width:22px;height:22px;border:2px solid #d5d5d5;border-top-color:var(--blue);border-radius:50%;animation:s 0.8s linear infinite;margin:0 auto 8px}
@keyframes s{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);background:#1d1d1f;color:#fff;padding:8px 14px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;z-index:50;pointer-events:none;max-width:90vw}
.toast.on{opacity:1}
@media (max-width:600px){
  .kpis{grid-template-columns:repeat(2,1fr)}
  .top h1 small{display:none}
  .saisie .idx{width:100%;flex:1 1 140px}
  .saisie select{flex:1 1 120px}
  .hide-sm{display:none}
  .hb{grid-template-columns:62px 1fr 54px}
}

/* Devis */
.dv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.dv-u{display:flex;align-items:center;gap:6px}.dv-u .inp{width:100%;min-width:0}
.dv-u span{font-size:11.5px;color:var(--muted);white-space:nowrap}
.dv-der{margin-top:10px;font-size:12.5px}
.dv-act{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
a.btn.dv-a{display:inline-flex;align-items:center;text-decoration:none}
.dv-ok{margin-top:12px}
.card h2.dv-h3{margin:16px 0 8px;font-size:13px}
table.t tr.dv-lieu td{background:var(--blue-soft);font-weight:600}
.dv-cat{display:inline-block;padding:1px 6px;border-radius:5px;font-size:11.5px}
.dv-cat.ELC{background:var(--elc)}.dv-cat.EAU{background:var(--eau)}.dv-cat.GAZ{background:var(--gaz)}
.dv-cpt select,.dv-cpt .inp{height:32px;font-size:12px;padding:0 6px}.dv-cpt .inp{width:70px}

/* Export index → Drive */
.ex-box{margin-top:10px;border:1px solid var(--line);border-radius:8px;padding:10px;background:#fff}
.ex-path{font-size:12.5px;margin-bottom:8px;line-height:1.6}
.ex-path a{color:var(--blue);text-decoration:none}
.ex-list{max-height:260px;overflow:auto;border-top:1px solid var(--line)}
.ex-f{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:9px 6px;cursor:pointer}
.ex-f:hover{background:var(--blue-soft)}
.hf{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.hf button{height:30px;padding:0 12px;border:1px solid #cfcfcb;border-radius:15px;background:#fff;font-size:12px;cursor:pointer;color:inherit}
.hf button.on{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
.hres{max-height:300px;overflow-y:auto;border:1px solid #e4e4e0;border-radius:8px}
.hres:empty{display:none}
.hit{display:flex;align-items:center;gap:10px;padding:8px 10px;border-bottom:1px solid #eeeeea;cursor:pointer}
.hit:last-child{border-bottom:0}
.hit:hover,.hit.act{background:#eef3fb}
.hit .hn{font-variant-numeric:tabular-nums;font-weight:600;min-width:62px;font-size:13px}
.hit .hd{flex:1;min-width:0}.hit .hd div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hit .hd .muted{font-size:11px}
.hit mark{background:#ffe58a;color:inherit;border-radius:2px;padding:0 1px}
.hres .vide{padding:14px;text-align:center;font-size:13px}
.hsel{display:flex;align-items:center;gap:10px;margin-top:8px;padding:8px 10px;border-radius:8px;background:#eef3fb}
.hsel .hd{flex:1;min-width:0}
</style>
</head>

const fr = (x, d) => x == null || x === '' ? '–' : Number(x).toLocaleString('fr-FR', { maximumFractionDigits: d == null ? 2 : d });
const pd = s => { const m = String(s || '').match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? new Date(+m[1], +m[2]-1, +m[3]) : null; };
const isoD = d => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
const moisC = s => { const d = pd(s); return d ? MOIS[d.getMonth()] + ' ' + String(d.getFullYear()).slice(2) : ''; };
const moisL = s => { const d = pd(s); return d ? MOIS_L[d.getMonth()] + ' ' + d.getFullYear() : ''; };
const jour = s => { const d = pd(s); return d ? String(d.getDate()).padStart(2,'0') + '/' + String(d.getMonth()+1).padStart(2,'0') + '/' + String(d.getFullYear()).slice(2) : ''; };
const nombre = v => { const s = String(v == null ? '' : v).replace(/[\s  ]/g,'').replace(',', '.'); return /^\d+(\.\d+)?$/.test(s) ? Number(s) : null; };

let tt; function toast(m){ const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 2600); }

function corriger(num, per, date){

  if (!Array.from(sel.options).some(o => o.value === per)) {
    const o = document.createElement('option'); o.value = per; o.textContent = moisL(per); sel.appendChild(o);
  }
  sel.value = per;
  S.seul = num; S.q = ''; $('#q').value = '';
  if (date) $('#date').value = String(date).slice(0, 10);
  show('releve');
  changerPeriode(per, () => {
    const c = S.compteurs.find(x => x.num === num);
    if (c) S.ouverts[c.secteur] = true;
    if (!date && c && c.cur && c.cur.date) $('#date').value = String(c.cur.date).slice(0, 10);
    renderReleve();
    const i = document.querySelector('.cpt[data-num="' + CSS.escape(num) + '"] .idx');
    if (i && !i.disabled) { i.focus(); i.select(); }
  });
}

    if (h.indexOf(S.q) < 0) return false;
  }
  const f = S.filtre;
  if (f === 'reste') return !c.cur || S.pending[c.num];

    anc.style.display = st.value === 'Changement compteur' ? 'block' : 'none';
    idx.disabled = sansIndex();
    fb.className = 'fb'; fb.textContent = '';
    if (sansIndex() || !idx.value) return;

    if (v === null) { fb.className = 'fb err'; fb.textContent = 'Format invalide : chiffres uniquement (virgule pour les décimales).'; return; }
    if (c.prevIndex == null || c.unite === '%' || st.value === 'Changement compteur') return;
    const d = v - c.prevIndex;
    if (d < 0) { fb.className = 'fb err'; fb.textContent = 'Inférieur à l\'index précédent (' + fr(c.prevIndex) + ') : vérifier la saisie.'; return; }

function envoyer(el, c, confirme){
  const qui = $('#qui').value.trim();
  if (!qui) { toast('Indiquez votre nom en haut de l\'écran.'); $('#qui').focus(); return; }
  store.set('rc_qui', qui);
  const p = { num: c.num, date: $('#date').value, periode: S.per, index: el.querySelector('.idx').value,
              statut: el.querySelector('.st').value, commentaire: el.querySelector('.com').value,
              releveur: qui, confirme: !!confirme, ancien: el.querySelector('.anc').value };
  const btn = el.querySelector('.sv'); btn.disabled = true; btn.textContent = '…';
  const zm = el.querySelector('.zone-msg'); zm.innerHTML = '';
  S.pending[c.num] = true;
  call('saveReleve', [p], r => {
    btn.disabled = false;
    if (r.ok) {
      delete S.pending[c.num];
      const i = S.compteurs.findIndex(x => x.num === c.num); S.compteurs[i] = r.compteur;
      toast('✓ n° ' + c.num + ' enregistré' + (r.compteur.cur && r.compteur.cur.conso != null ? ' · conso ' + fr(r.compteur.cur.conso) + ' ' + c.unite : ''));
      const next = suivant(el);
      renderReleve();
      if (next) { const n = document.querySelector('.cpt[data-num="' + CSS.escape(next) + '"] .idx'); if (n && !n.disabled) n.focus({ preventScroll: false }); }
    } else {
      btn.textContent = c.cur ? 'Modifier' : 'Valider';
      el.classList.remove('done'); el.classList.add(r.code === 'SAUT' ? 'warn' : 'err');
      if (r.code === 'SAUT') {
        zm.innerHTML = '<div class="msg warn">' + esc(r.message) + '<br><button class="btn warn cf">Je confirme cet index</button></div>';
        zm.querySelector('.cf').addEventListener('click', () => envoyer(el, c, true));
      } else {
        zm.innerHTML = '<div class="msg err">' + esc(r.message) + '</div>';
      }
    }
  }, e => { btn.disabled = false; btn.textContent = 'Valider'; zm.innerHTML = '<div class="msg err">Échec de l\'enregistrement (réseau ?). Réessayer.</div>'; });
}
function suivant(el){
  const all = Array.from(document.querySelectorAll('.cpt')); const i = all.indexOf(el);
  for (let k = i + 1; k < all.length; k++) { const n = all[k].dataset.num; const c = S.compteurs.find(x => x.num === n); if (c && !c.cur) return n; }
  return null;
}

// ───────────────────────── Devis
/* Accès au Devis protégé par le code du service Bâtiment (le même que l'appli Demandes de travaux).
   Seule l'empreinte SHA-256 du code est dans la page ; une fois saisi, l'appareil s'en souvient. */
const DEVIS_CODE_SHA = '1a1bf0b0d9da883d9e2f3f627632e35710fec6cbe64692bfdd9b024ea168f4f7';
const devisOuvert = () => store.get('rc_devis_ok') === DEVIS_CODE_SHA;
async function sha256(t){ const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); }
function verrouDevis(){
  $('#devis').innerHTML = '<div class="card mb" style="max-width:360px;margin:30px auto"><h2>🔒 Devis – accès Bâtiment</h2>'
    + '<p style="font-size:13px;color:var(--muted);margin:6px 0 10px">Saisissez le code du service Bâtiment.</p>'
    + '<input class="inp" id="dv-code" type="password" autocomplete="off" placeholder="Code d’accès">'
    + '<div class="dv-act"><button class="btn" id="dv-ok">Ouvrir</button></div></div>';
  const go = async () => {
    const c = $('#dv-code').value.trim(); if (!c) return;
    if (await sha256(c) !== DEVIS_CODE_SHA) { toast('Code incorrect'); $('#dv-code').select(); return; }
    store.set('rc_devis_ok', DEVIS_CODE_SHA); chargerDevis();
  };
  $('#dv-ok').addEventListener('click', go);
  $('#dv-code').addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
  setTimeout(() => $('#dv-code').focus(), 50);
}
function fermerDevis(){ try { localStorage.removeItem('rc_devis_ok'); } catch(e){} S.devis = null; verrouDevis(); }
function chargerDevis(){
  $('#devis').innerHTML = '<div class="empty"><div class="spin"></div></div>';
  call('getDevisInit', [], d => { S.devis = d; renderDevis(); });
}
function dvEur(x, d){ return x == null ? '–' : Number(x).toLocaleString('fr-FR', { minimumFractionDigits: d == null ? 2 : d, maximumFractionDigits: d == null ? 2 : d }) + ' €'; }
function dvTarifsForm(){
  const t = {};
  S.devis.tarifsDef.forEach(x => { const v = String($('#dv-' + x.k).value).replace(',', '.'); t[x.k] = v === '' ? '' : Number(v); });
  return t;
}
function dvDerives(){
  const t = dvTarifsForm();
  $('#dv-der').innerHTML = 'Eau froide adoucie : <b>' + dvEur(t.eau * t.coefAdoucie, 3) + '</b>/m³ · Eau chaude adoucie : <b>' + dvEur(t.eau * t.coefChaude, 3)
    + '</b>/m³ · Gaz ≈ <b>' + dvEur(t.gaz * t.convGaz, 3) + '</b>/m³';
}
function dvRemplirTarifs(){
  const t = S.devis.tarifs[$('#dv-cli').value] || {};
  S.devis.tarifsDef.forEach(x => { $('#dv-' + x.k).value = t[x.k] == null ? '' : t[x.k]; });
  $('#dv-t-cli').textContent = $('#dv-cli').value;
  $('#dv-prev').innerHTML = ''; $('#dv-res').innerHTML = '';
  dvDerives();
}

    + '</div><h2 class="dv-h3">Tarifs <span id="dv-t-cli"></span></h2><div class="dv-grid">'

  h += '<div class="card mb"><h2>Devis édités</h2><div id="dv-hist"></div><div class="dv-act"><button class="btn sec" id="dv-purge">Purger les devis</button><button class="btn sec" id="dv-lock">🔒 Verrouiller</button></div></div>';
  $('#devis').innerHTML = h;
  renderDevisHist();

  $('#dv-purge').addEventListener('click', e => {
    if (!confirm('Supprimer tous les devis édités ?\n\nLe registre est vidé : la numérotation repart à 001.')) return;

    call('purgerDevis', [], msg => { S.devis.historique = []; renderDevisHist(); b.disabled = false; b.textContent = 'Purger les devis'; toast(msg); },

  });
  dvRemplirTarifs();
  $('#dv-cli').addEventListener('change', dvRemplirTarifs);
  $('#dv-per').addEventListener('change', () => { $('#dv-prev').innerHTML = ''; $('#dv-res').innerHTML = ''; });
  d.tarifsDef.forEach(x => $('#dv-' + x.k).addEventListener('input', dvDerives));
  $('#dv-save-t').addEventListener('click', () => {
    const cli = $('#dv-cli').value;
    call('saveDevisTarifs', [cli, dvTarifsForm()], t2 => { S.devis.tarifs = t2; toast('Tarifs ' + cli + ' enregistrés'); });
  });
  $('#dv-save-c').addEventListener('click', () => {
    const lignes = [...document.querySelectorAll('.dv-cpt tbody tr')].map(tr => ({

  $('#dv-ap').addEventListener('click', () => {

  });
  $('#dv-gen').addEventListener('click', e => {
    if (!$('#dv-per').value) return toast('Aucune période disponible');

function dvEditer(b, ko){
    call('genererDevis', [$('#dv-per').value, $('#dv-cli').value, $('#dv-obj').value.trim(), dvTarifsForm()], r => {
      b.disabled = false; b.textContent = 'Éditer le devis (PDF + Excel)';
      S.devis.historique = r.historique; renderDevisHist();
      $('#dv-res').innerHTML = '<div class="fb ok dv-ok"><b>Devis ' + esc(r.numero) + '</b> · ' + dvEur(r.totalHT) + ' HT · ' + dvEur(r.totalTTC) + ' TTC'
        + '<div class="dv-act"><button class="btn" id="dv-dl-pdf">Télécharger le PDF</button><button class="btn" id="dv-dl-xls">Télécharger l\'Excel</button></div></div>';
      $('#dv-dl-pdf').addEventListener('click', () => dvDl(r.pdf));
      $('#dv-dl-xls').addEventListener('click', () => dvDl(r.xlsx));
      toast('Devis ' + r.numero + ' édité');
    }, ko);
}
function dvDl(f){
  try {
    const url = URL.createObjectURL(f.blob);
    const a = document.createElement('a'); a.href = url; a.download = f.name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  } catch (e) { window.open(f.url, '_blank'); }
}

function chargerEau(){
  $('#eau').innerHTML = '<div class="empty"><div class="spin"></div></div>';
  call('getEau', [], d => { S.eau = d; renderEau(d, $('#eau')); });
}
function renderEau(d, root){
  if (!d.mois.length) { root.innerHTML = '<div class="card empty">Aucun relevé d\'eau.</div>'; return; }
  const n = d.mois.length - 1, last = d.mois[n];
  const moy = a => { const v = a.slice(0, n).filter(x => x != null && x > 0); return v.length ? v.reduce((s, x) => s + x, 0) / v.length : null; };
  const var_ = (v, m) => m && v != null ? (v >= m ? '+' : '') + Math.round((v / m - 1) * 100) + ' % vs moy.' : '';
  let h = '<div class="kpis big">'
    + '<div class="kpi"><b>' + fr(d.gen[n], 0) + '</b><span>Arrivées générales (m³) · ' + moisC(last) + '<br>' + var_(d.gen[n], moy(d.gen)) + '</span></div>'
    + '<div class="kpi"><b>' + fr(d.div[n], 0) + '</b><span>Sous-compteurs (m³)</span></div>'
    + '<div class="kpi"><b>' + fr(d.ecart[n], 0) + '</b><span>Non comptabilisé (m³)' + (d.refEcart != null ? '<br>habituel ≈ ' + fr(d.refEcart, 0) : '') + '</span></div>'
    + '<div class="kpi"><b>' + d.alertes.length + '</b><span>Alertes</span></div></div>';
  if (d.alertes.length) {
    h += '<details class="banner"' + (d.alertes.some(a => a.niveau === 'haute') ? ' open' : '') + '><summary>▸ À vérifier (' + d.alertes.length + ') <span>— toucher pour afficher</span></summary><div style="margin-top:6px">'
      + d.alertes.map(a => '<div class="alert"><b><span class="lvl ' + a.niveau + '"></span>' + esc(a.titre) + '</b>' + esc(a.detail) + '</div>').join('') + '</div></details>';
  }
  const mx = Math.max.apply(null, d.gen.concat(d.div).map(x => x || 0)) || 1;
  h += '<div class="card chart mb"><h2>Eau par mois (m³)</h2><div class="legend"><span><i style="background:var(--blue)"></i>Arrivées générales</span><span><i style="background:var(--grey-bar)"></i>Sous-compteurs</span></div>'
    + d.mois.map((m, i) => '<div class="hb"><div class="lbl">' + moisC(m) + '</div><div class="bars"><div class="b1" style="width:' + ((d.gen[i] || 0) / mx * 100) + '%"></div><div class="b2" style="width:' + ((d.div[i] || 0) / mx * 100) + '%"></div></div><div class="val">' + fr(d.gen[i], 0) + '</div></div>').join('')
    + '<p class="muted" style="font-size:11.5px;margin:8px 0 0">Les sous-compteurs ne couvrent qu\'une partie des usages : surveiller surtout l\'évolution de l\'écart hors période de salon.</p></div>';
  const roles = ['Arrivée générale', 'Nappe', 'Divisionnaire', 'Aval adoucisseur'];
  h += '<div class="card"><h2>Par compteur · ' + moisC(last) + '</h2><div class="scroll"><table class="t"><thead><tr><th>Compteur</th><th class="n">Mois</th><th class="n hide-sm">Habituel</th><th class="hide-sm">12 mois</th><th></th></tr></thead><tbody>';
  roles.forEach(ro => {
    const l = d.compteurs.filter(c => c.role === ro); if (!l.length) return;
    h += '<tr><td colspan="5" style="background:var(--blue-soft);font-weight:600;font-size:12px">' + esc(ro) + '</td></tr>';
    l.forEach(c => {
      const sm = Math.max.apply(null, c.conso.map(x => x || 0)) || 1;
      h += '<tr' + (c.alerte ? ' class="hl"' : '') + '><td>' + esc(c.designation) + ' <span class="num">n° ' + esc(c.num) + '</span><div class="muted" style="font-size:11.5px">' + esc(c.localisation) + '</div></td>'
        + '<td class="n"><b>' + fr(c.dernier, 1) + '</b></td><td class="n hide-sm">' + fr(c.ref, 1) + '</td>'
        + '<td class="hide-sm"><span class="spark">' + c.conso.slice(-12).map(x => '<i style="height:' + Math.max(1, (x || 0) / sm * 18) + 'px"></i>').join('') + '</span></td>'
        + '<td>' + (c.alerte ? '<span class="tag' + (c.alerte === 'Continu' ? ' m' : '') + '">' + esc(c.alerte) + '</span>' : '') + '</td></tr>';
    });
  });
  h += '</tbody></table></div></div>';
  root.innerHTML = h;
}

// ───────────────────────── Devis : PDF (jsPDF) et Excel (ExcelJS) fabriqués dans la page, même trame qu'avant. Plus de script Google.
let jspdfP = null;
const chargerJsPDF = () => (jspdfP = jspdfP || import('https://cdn.jsdelivr.net/npm/jspdf@2.5.2/+esm').then(m => m.jsPDF || (m.default && m.default.jsPDF)).catch(() => { jspdfP = null; throw new Error('Module PDF non chargé (connexion ?)'); }));
const DV_COUL = { ELECTRICITE: '#F2B51E', 'EAU FROIDE BRUTE': '#5B9BD5', 'EAU FROIDE ADOUCIE': '#5B9BD5', 'EAU CHAUDE ADOUCIE': '#5B9BD5', GAZ: '#9E9E9E' };
const DV_FOND = { ELECTRICITE: '#FFF4C7', 'EAU FROIDE BRUTE': '#DCEBFB', 'EAU FROIDE ADOUCIE': '#DCEBFB', 'EAU CHAUDE ADOUCIE': '#DCEBFB', GAZ: '#E7E7E7' };
const dvNb = (n, d) => (n === null || n === undefined || n === '' || isNaN(n)) ? '' : Number(n).toLocaleString('fr-FR', { minimumFractionDigits: d || 0, maximumFractionDigits: d || 0 }).replace(/[  ]/g, ' ');

// stratégie Chrome/Edge), on bascule automatiquement sur un téléchargement classique
// (dossier Téléchargements) au lieu de s'arrêter sans rien afficher.
window.cptExportIndexTest = async () => { await pretDocs; return fabriquerExportIndex(M.donneesExport(DOCS)); }; // contrôle sans téléchargement
async function exporterIndex(){
  // Version 3 : le bouton réagit toujours. On prépare d'abord le fichier (≈ 15 s),
  // puis on affiche « Télécharger le fichier » : le téléchargement part d'un clic,
  // donc aucun navigateur (Edge/Chrome gérés, Safari, Firefox) ne peut le bloquer.
  // « Enregistrer sous… » reste proposé quand le navigateur le permet.
  const b = $('#ex-open'), z = $('#ex-pick');
  const nom = 'Index compteurs Eurexpo - ' + isoD(new Date()) + '.xlsx';
  b.disabled = true; b.textContent = 'Export en cours…';
  z.innerHTML = '<div class="muted" style="font-size:12.5px;margin-top:8px">Préparation du fichier Excel…</div>';
  const fin = () => { b.disabled = false; b.textContent = 'Exporter en Excel…'; };
  call('exporterIndex', [], r => {
    fin();
    try {
      const blob = r.blob;
      const url = URL.createObjectURL(blob);
      z.innerHTML = '<div class="fb ok dv-ok">✓ Fichier prêt (' + r.compteurs + ' compteurs · ' + r.mois + ' mois)</div>'
        + '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">'
        + '<a class="btn" id="ex-dl" href="' + url + '" download="' + esc(nom) + '" style="text-decoration:none">Télécharger le fichier</a>'
        + (window.showSaveFilePicker ? '<button type="button" class="btn sec" id="ex-save">Enregistrer sous…</button>' : '')
        + '</div>';
      $('#ex-dl').addEventListener('click', () => toast('Téléchargement lancé (dossier Téléchargements)'));
      const s = $('#ex-save');
      if (s) s.addEventListener('click', async () => {
        try {
          const fh = await window.showSaveFilePicker({ suggestedName: nom, types: [{ description: 'Classeur Excel', accept: { 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet': ['.xlsx'] } }] });
          const w = await fh.createWritable(); await w.write(blob); await w.close();
          toast('Enregistré : ' + fh.name);
        } catch (e) {
          if (e && e.name === 'AbortError') return;
          toast('« Enregistrer sous » indisponible sur ce poste : utilisez « Télécharger le fichier »');
        }
      });
    } catch (e) { toast('Erreur : ' + (e && e.message || e)); }
  }, x => { fin(); z.innerHTML = ''; toast('Erreur : ' + (x && x.message || x)); });
}
function btnCorr(num, per, date){
  if (!num || !per) return '';
  return '<button type="button" class="btn sec corr" style="height:30px;padding:0 10px;font-size:12px" data-num="' + esc(num) + '" data-per="' + esc(String(per).slice(0, 10)) + '" data-date="' + esc(date ? String(date).slice(0, 10) : '') + '">Corriger</button>';
}
// Recherche dans l'historique : liste de résultats cliquable (n°, désignation, localisation, secteur, type),
// sans tenir compte des accents ; filtre par énergie ; flèches ↑ ↓ + Entrée au clavier, Échap pour refermer
function sansAcc(x){ return String(x == null ? '' : x).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase(); }
const HR = { type: '', liste: [], act: -1, num: '' };
const TYPES_L = { EAU: 'Eau', ELC: 'Électricité', GAZ: 'Gaz', FUEL: 'Fioul' };
function initRechHist(){
  const q = $('#hq');
  q.addEventListener('input', () => { HR.act = -1; ouvrirRes(); remplirHsel(); });
  q.addEventListener('focus', () => { if (HR.num) { ouvrirRes(); remplirHsel(); } });
  q.addEventListener('keydown', e => {
    const n = HR.liste.length;
    if (e.key === 'ArrowDown' && n) { e.preventDefault(); ouvrirRes(); HR.act = (HR.act + 1) % n; majAct(); }
    else if (e.key === 'ArrowUp' && n) { e.preventDefault(); HR.act = (HR.act - 1 + n) % n; majAct(); }
    else if (e.key === 'Enter') { e.preventDefault(); const c = HR.liste[HR.act >= 0 ? HR.act : 0]; if (c) choisirHist(c.num); }
    else if (e.key === 'Escape' && HR.num) { fermerRes(); q.blur(); }
  });
  $('#hf').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    HR.type = b.dataset.t; HR.act = -1;
    $('#hf').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
    ouvrirRes(); remplirHsel();
  });
  $('#hres').addEventListener('click', e => { const h = e.target.closest('.hit'); if (h) choisirHist(h.dataset.num); });
  $('#hsel').addEventListener('click', e => { if (e.target.closest('.chg')) { ouvrirRes(); remplirHsel(); q.focus(); } });
}
function ouvrirRes(){ $('#hres').style.display = ''; $('#hf').style.display = ''; $('#hsel').style.display = 'none'; $('#hq').setAttribute('aria-expanded', 'true'); }
function fermerRes(){
  const c = S.compteurs.find(x => String(x.num) === String(HR.num)); if (!c) return;
  $('#hres').style.display = 'none'; $('#hf').style.display = 'none'; $('#hq').setAttribute('aria-expanded', 'false');
  const z = $('#hsel'); z.style.display = 'flex';
  z.innerHTML = '<span class="chip ' + esc(c.type) + '">' + esc(c.type) + '</span><div class="hd"><b>' + esc(c.num) + '</b> · ' + esc(c.designation)
    + '<div class="muted" style="font-size:11px">' + esc(c.localisation) + ' · ' + esc(c.secteur) + '</div></div>'
    + '<button type="button" class="btn sec chg" style="height:30px;padding:0 10px;font-size:12px">Changer</button>';
}
function choisirHist(num){ HR.num = String(num); fermerRes(); chargerHist(num); }
function surligne(txt, mots){
  let t = esc(txt); if (!mots.length) return t;
  // repère les positions dans le texte sans accents, puis surligne le texte d'origine aux mêmes positions
  const src = String(txt == null ? '' : txt), base = sansAcc(src);
  if (base.length !== src.length) return t;
  const on = new Array(src.length).fill(false);
  mots.forEach(m => { let i = base.indexOf(m); while (i >= 0) { for (let k = i; k < i + m.length; k++) on[k] = true; i = base.indexOf(m, i + 1); } });
  let out = '', ouvert = false;
  for (let k = 0; k < src.length; k++) {
    if (on[k] && !ouvert) { out += '<mark>'; ouvert = true; } else if (!on[k] && ouvert) { out += '</mark>'; ouvert = false; }
    out += esc(src[k]);
  }
  return out + (ouvert ? '</mark>' : '');
}
function majAct(){
  const hs = $('#hres').querySelectorAll('.hit');
  hs.forEach((h, i) => h.classList.toggle('act', i === HR.act));
  if (hs[HR.act]) hs[HR.act].scrollIntoView({ block: 'nearest' });
}
function remplirHsel(){
  const mots = sansAcc($('#hq').value).trim().split(/\s+/).filter(Boolean);
  const L = S.compteurs.filter(c => !HR.type || c.type === HR.type)
    .filter(c => { const t = sansAcc([c.num, c.designation, c.localisation, c.secteur, c.type, TYPES_L[c.type]].join(' ')); return mots.every(m => t.includes(m)); })
    .map(c => { const n = sansAcc(c.num), m0 = mots[0] || ''; return { c, r: !m0 ? 2 : n === m0 ? 0 : n.startsWith(m0) ? 1 : 2 }; })
    .sort((a, b) => a.r - b.r || a.c.ordre - b.c.ordre).map(x => x.c);
  HR.liste = L; if (HR.act >= L.length) HR.act = -1;
  $('#hnb').textContent = (mots.length || HR.type) ? '— ' + L.length + ' sur ' + S.compteurs.length : '— ' + S.compteurs.length + ' compteurs';
  $('#hres').innerHTML = L.length
    ? L.map((c, i) => '<div class="hit' + (i === HR.act ? ' act' : '') + '" role="option" data-num="' + esc(c.num) + '">'
        + '<span class="hn">' + surligne(c.num, mots) + '</span>'
        + '<div class="hd"><div>' + surligne(c.designation, mots) + '</div><div class="muted">' + surligne(c.localisation, mots) + ' · ' + surligne(c.secteur, mots) + '</div></div>'
        + '<span class="chip ' + esc(c.type) + '">' + esc(c.type) + '</span></div>').join('')
    : '<div class="vide muted">Aucun compteur trouvé' + (HR.type ? ' en ' + TYPES_L[HR.type] + ' — essayez « Tous »' : '') + '.</div>';
  if (HR.num && $('#hsel').style.display !== 'none') fermerRes();
}
function chargerHist(num){
  if (!num) { $('#hist').innerHTML = '<div class="card empty">Choisir un compteur ci-dessus.</div>'; return; }
  $('#hist').innerHTML = '<div class="empty"><div class="spin"></div></div>';
  call('getHistorique', [num], d => {
    const c = d.compteur, l = d.releves.slice().reverse();
    const mx = Math.max.apply(null, l.map(r => r.conso || 0)) || 1;
    $('#hist').innerHTML = '<div class="card"><h2>' + esc(c.designation) + ' <span class="chip ' + esc(c.type) + '">' + esc(c.type) + '</span> <span class="num">n° ' + esc(c.num) + '</span></h2>'
      + '<div class="loc">' + esc(c.localisation) + ' · ' + esc(c.secteur) + '</div>'
      + '<div class="scroll"><table class="t"><thead><tr><th>Mois</th><th class="n">Index</th><th class="n">Conso (' + esc(c.unite) + ')</th><th class="hide-sm" style="width:30%"></th><th>Statut</th><th></th></tr></thead><tbody>'
      + l.map(r => '<tr' + (r.ctrl && !/Changement|confirmé/.test(r.ctrl) ? ' class="hl"' : '') + '><td>' + moisC(r.per) + '<div class="muted" style="font-size:11px">' + jour(r.date) + ' · ' + esc(r.qui) + '</div></td><td class="n">' + fr(r.index) + '</td><td class="n">' + fr(r.conso) + '</td>'
        + '<td class="hide-sm"><div style="height:8px;border-radius:2px;background:var(--blue);width:' + ((r.conso || 0) / mx * 100) + '%"></div></td>'
        + '<td>' + (r.statut && r.statut !== 'OK' ? '<span class="tag m">' + esc(r.statut) + '</span> ' : '') + (r.ctrl ? '<span class="tag">' + esc(r.ctrl) + '</span>' : '') + (r.com ? '<div class="muted" style="font-size:11px">' + esc(r.com) + '</div>' : '') + '</td>'
        + '<td class="n">' + btnCorr(c.num, r.per, r.date) + '</td></tr>').join('')
      + '</tbody></table></div></div>';
  });
}

init();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
